{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block title %} {% endblock %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" />
    <link rel="stylesheet" href="{% static 'peams_app/style.css'%}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <header>
        <div class="logo">
            <h1>PEAMS</h1>
        </div>
        <nav>
            <ul>
                <li><a href="{% url 'home' %}">Home</a></li>
                <li><a href="{% url 'products' %}">Products</a></li>
                <li><a href="{% url 'tracker' %}">Tracker</a></li>
                <li><a href="{% url 'notify' %}">Notifications</a></li>
                <li><a href="{% url 'logout' %}">LogOut</a></li>
            </ul>
        </nav>
        {% if user %}
            <h6 class="text-primary-emphasis bg-primary-subtle p-2 rounded">Welcome {{user.username}}</h6>
        {% endif %}
    </header>
    {% block body %}
    {% endblock %}

    <footer>
        <p>&copy; 2023 PEAMS. All rights reserved.</p>
    </footer>

    {% block script %}
    {% endblock %}
</body>
</html>
